name: Compile Cross-Platform Binaries

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 1. LINUX BUILD (Ultra-Fast)
  build-linux:
    name: Compile on Linux
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cython

    - name: Install Linux Build Tools
      run: |
        sudo apt update
        sudo apt install -y build-essential python3-dev

    - name: Translate Python to C via Cython
      run: cython --embed -o find_0b.c find_0b.py

    - name: Compile with GCC (Optimized for size)
      run: gcc -Os find_0b.c $(python3-config --cflags --embed --ldflags) -o find_0b-linux

    - name: Upload Linux Binary
      uses: actions/upload-artifact@v4
      with:
        name: find_0b-linux-binary
        path: find_0b-linux

  # 2. MAC INTEL BUILD (Fixes the frozen queue)
  build-mac-intel:
    name: Compile on Mac Intel
    runs-on: macos-26-intel
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka zstandard

    - name: Compile with Nuitka for Intel
      run: |
        python -m nuitka --onefile \
          --macos-target-arch=x86_64 \
          --prefer-source-code \
          --python-flag=-OO \
          find_0b.py -o find_0b-mac-intel

    - name: Upload Intel Mac Binary
      uses: actions/upload-artifact@v4
      with:
        name: find_0b-mac-intel-binary
        path: find_0b-mac-intel

  # 3. MAC APPLE SILICON BUILD (Restored to dashboard)
  build-mac-arm:
    name: Compile on Mac Apple Silicon
    runs-on: macos-26
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka zstandard

    - name: Compile with Nuitka for Apple Silicon
      run: |
        python -m nuke-installer || true
        python -m nuitka --onefile \
          --macos-target-arch=arm64 \
          --prefer-source-code \
          --python-flag=-OO \
          find_0b.py -o find_0b-mac-arm

    - name: Upload Apple Silicon Mac Binary
      uses: actions/upload-artifact@v4
      with:
        name: find_0b-mac-arm-binary
        path: find_0b-mac-arm
